<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #1a202c;
            color: white;
        }
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 500;
        }
        .nav-link {
            font-weight: 500;
            color: #f8f9fa !important;
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: #ffd700 !important;
        }
        .container {
            max-width: 1100px;
            margin-top: 30px;
        }
        .footer {
            background-color: #1a202c;
            color: white;
            text-align: center;
            padding: 1.5rem 0;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }
        .footer p {
            margin: 0;
            font-size: 0.9rem;
        }
        .navbar-toggler-icon {
            background-color: #ffd700;
        }
        /* Card styles for content */
        .card {
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .card-header {
            background-color: #1a202c;
            color: white;
            font-weight: 600;
        }
        .card-body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Wellnest</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href={% url "Admin:home" %}>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url "Admin:viewdoctors" %}">View Doctors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url "Admin:adddoctor" %}">Add Doctors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url "Admin:viewusers" %}">View Users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url "Admin:viewappoiments" %}">View Appointments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url "Admin:FetchPosts" %}">View Posts</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        <!-- Content from child templates will be inserted here -->
        {% endblock %}
    </div>

    <footer class="footer">
        <p>&copy; 2024 My App. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
